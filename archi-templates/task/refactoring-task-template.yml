id: refactoring-task-template
name: 重构任务模板
description: 通用架构重构流程：现状分析 → 架构设计与迁移计划 → 分阶段实施 → 测试验证 → 文档更新
category: task
# 步骤定义
steps:
  - id: current-state-analysis
    type: DraftProposalStep
    form:
      title: 现状分析
      schema:
        content:
          type: textarea
          title: 现状分析内容
          description: |
            💡 提示：请关注以下要点：
            1. 重构目标：明确本次重构的目标和期望达到的效果
            2. 关注点：重点关注性能、可维护性、扩展性、代码质量等方面
            3. 已知问题：列出已经发现的问题或痛点
            4. 约束条件：说明时间、资源、技术栈等约束条件
            5. 代码结构：分析当前代码的组织方式和模块划分
            6. 依赖关系：分析模块间的依赖关系，识别循环依赖和紧耦合
            7. 受影响文件：列出所有需要迁移、修改或删除的文件
            8. 潜在风险：识别重构过程中可能遇到的技术和业务风险
          required: false
    prompt: |
      你是一个专业的系统架构师，需要分析当前代码库的现状，为架构重构做准备：
      
      任务名称：{{ task.name }}
      任务描述：{{ task.description }}
      * **方案路径**：{{ solutionPath }}

      关联文件（需要分析的架构文档）：
      {% if relatedFiles %}
      {% for file in relatedFiles %}
      - {{ file.name }} ({{ file.type }}): {{ file.path }}
        {% if file.vaultName %}所属 Vault: {{ file.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文件）
      {% endif %}

      关联的代码路径（需要分析的代码目录）：
      {% if relatedCodePaths %}
      {% for codePath in relatedCodePaths %}
      - {{ codePath }}
      {% endfor %}
      {% else %}
      （暂无关联代码路径）
      {% endif %}

      关联的文档（参考文档）：
      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      - {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}
      
      当前步骤表单数据：
      {% if formDataItems %}
      {% for item in formDataItems %}
      - {{ item.key }}: {{ item.value }}
      {% endfor %}
      {% else %}
      （暂无表单数据）
      {% endif %}
      
      请基于以上信息，进行详细的现状分析，包括：
      1. **代码结构分析**：分析当前代码的组织方式，识别需要重构的模块和需要保留的模块
      2. **依赖关系分析**：分析模块间的依赖关系，绘制依赖图，识别循环依赖和紧耦合
      3. **耦合点识别**：找出代码中的耦合点，识别违反单一职责原则、依赖倒置原则的地方
      4. **受影响文件清单**：列出所有需要迁移、修改或删除的文件，按优先级分类
      5. **潜在风险识别**：识别重构过程中可能遇到的技术风险、业务风险、兼容性风险
      6. **数据统计**：统计代码量、文件数量、依赖数量、测试覆盖率等关键指标
      
      在分析时，请特别关注表单数据中提供的重构目标、关注点和已知问题。
    depends_on: []

  - id: architecture-design
    type: ReviewAlignmentStep
    form:
      title: 架构设计与迁移计划
      schema:
        content:
          type: textarea
          title: 架构设计与迁移计划内容
          description: |
            💡 提示：请关注以下要点（本步骤同时产出目标架构与可执行迁移计划）：
            1. 设计原则：明确遵循的设计原则（如：SOLID、DDD、分层架构等）
            2. 技术选型：说明技术栈偏好或约束（如：必须使用的框架、不能使用的技术等）
            3. 参考架构：描述参考的架构模式或现有架构（如：微服务、模块化、插件化等）
            4. 特殊要求：列出其他特殊需求或约束
            5. 目标架构：设计新的目录结构、模块划分和依赖关系
            6. 迁移策略：制定分阶段迁移计划、迁移顺序和回滚方案
            7. 包结构：设计包命名规范、依赖管理和版本管理策略
            8. 风险评估：识别技术风险、业务风险并制定应对措施
            9. 时间与资源约束：结合时间要求、优先级、人力与环境资源限制
            10. 阶段划分：为迁移拆分阶段，定义阶段目标、任务清单与验收标准
            11. 文件迁移清单：为每个阶段列出文件源路径、目标路径与迁移优先级
            12. 依赖与构建更新：规划依赖配置、版本策略、构建脚本与构建流程调整
            13. 测试计划：为各阶段设计测试策略、测试用例与回归测试计划
          required: false
    prompt: |
      你是一个专业的系统架构师，需要基于现状分析同时设计**目标架构**并给出**可执行的迁移计划**：
      
      任务名称：{{ task.name }}
      * **方案路径**：{{ solutionPath }}

      关联文件（架构设计参考）：
      {% if relatedFiles %}
      {% for file in relatedFiles %}
      - {{ file.name }} ({{ file.type }}): {{ file.path }}
        {% if file.vaultName %}所属 Vault: {{ file.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文件）
      {% endif %}

      关联的代码路径（需要重构/迁移的代码）：
      {% if relatedCodePaths %}
      {% for codePath in relatedCodePaths %}
      - {{ codePath }}
      {% endfor %}
      {% else %}
      （暂无关联代码路径）
      {% endif %}

      关联的文档（参考文档）：
      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      - {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}

      关联的设计（参考设计）：
      {% if relatedDesigns %}
      {% for design in relatedDesigns %}
      - {{ design.name }}: {{ design.path }}
        {% if design.vaultName %}所属 Vault: {{ design.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联设计）
      {% endif %}
      
      当前步骤表单数据：
      {% if formDataItems %}
      {% for item in formDataItems %}
      - {{ item.key }}: {{ item.value }}
      {% endfor %}
      {% else %}
      （暂无表单数据）
      {% endif %}
      
      请基于以上信息，输出一个**合一的目标架构与迁移计划**，包括：
      1. **目标架构设计**：
         - 新的目录结构设计（符合项目规范和最佳实践）
         - 模块划分方案（按职责、按层次、按功能等）
         - 依赖关系设计（消除循环依赖，降低耦合度）
         - 接口抽象设计（定义清晰的接口边界）
      2. **迁移总体策略**：
         - 分阶段迁移策略（整体思路与关键原则）
         - 迁移顺序（识别关键路径，确定迁移优先级）
         - 迁移步骤（重要阶段的步骤梳理，包括前置条件和后置条件）
         - 回滚方案（如果出现问题如何快速回滚到稳定状态）
      3. **阶段划分与时间/资源约束**：
         - 每个阶段的名称和目标
         - 每个阶段的具体任务清单与依赖关系
         - 每个阶段的预计时间（考虑时间约束与资源限制）
         - 每个阶段的验收标准
      4. **文件迁移清单（高层视角）**：
         - 关键文件/目录的源路径和目标路径
         - 文件迁移时需要修改的内容（导入路径、依赖等）的典型示例
         - 文件或模块的迁移优先级（可按阶段/批次归类）
         - 需要删除或废弃的文件/模块分类
      5. **依赖与构建更新规划**：
         - 依赖配置文件的更新思路（根据项目使用的包管理工具）
         - 依赖版本管理策略
         - 依赖关系调整（新增、删除、更新依赖）的总体原则
         - 构建脚本与构建流程的调整方向（新增/修改脚本、构建产物划分等）
      6. **测试计划概要**：
         - 各阶段测试策略（功能、回归、性能等的覆盖范围）
         - 测试用例设计的重点
         - 回归测试与性能测试在整体迁移中的安排
      7. **风险评估与应对**：
         - 技术风险评估（识别可能的技术难点和风险点）
         - 业务风险评估（评估对现有功能和上线节奏的影响）
         - 应对措施（针对每个风险点的缓解策略）
      
      在设计时，请遵循表单数据中指定的设计原则，综合考虑技术选型约束和时间/资源限制，使输出既能指导架构落地，又能直接驱动后续实施阶段。
    depends_on:
      - current-state-analysis

  - id: phase-implementation
    type: ImplementationStep
    form:
      title: 分阶段实施
      schema:
        content:
          type: textarea
          title: 实施内容
          description: |
            💡 提示：请关注以下要点：
            1. 当前阶段：明确当前正在实施的阶段名称和主要任务
            2. 实施重点：说明本阶段重点关注的内容或需要特别注意的事项
            3. 特殊说明：列出实施过程中的特殊要求或注意事项
            4. 当前阶段实施：执行当前阶段的任务，按照文件迁移清单逐个迁移或重构文件
            5. 代码实现：创建新目录结构、迁移代码、重构代码、更新导入路径和依赖
            6. 问题处理：记录实施过程中遇到的问题，提供解决方案和替代方案
            7. 进度跟踪：记录已完成的文件和任务，更新实施进度和完成度
            8. 下一步计划：明确下一阶段的任务和目标，准备实施环境和前置条件
          required: false
    prompt: |
      你是一个专业的软件开发工程师，需要基于「架构设计与迁移计划」步骤的输出进行分阶段实施：
      
      任务名称：{{ task.name }}
      * **方案路径**：{{ solutionPath }}

      关联的代码路径（需要实施迁移的代码）：
      {% if relatedCodePaths %}
      {% for codePath in relatedCodePaths %}
      - {{ codePath }}
      {% endfor %}
      {% else %}
      （暂无关联代码路径）
      {% endif %}

      关联的文档（参考文档）：
      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      - {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}

      关联的设计（参考设计）：
      {% if relatedDesigns %}
      {% for design in relatedDesigns %}
      - {{ design.name }}: {{ design.path }}
        {% if design.vaultName %}所属 Vault: {{ design.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联设计）
      {% endif %}
      
      当前步骤表单数据：
      {% if formDataItems %}
      {% for item in formDataItems %}
      - {{ item.key }}: {{ item.value }}
      {% endfor %}
      {% else %}
      （暂无表单数据）
      {% endif %}
      
      请基于以上信息，进行分阶段实施，包括：
      1. **当前阶段实施**：
         - 根据迁移计划，执行当前阶段的任务
         - 按照文件迁移清单，逐个迁移或重构文件
         - 更新导入路径、引用关系和依赖关系
         - 更新构建脚本、配置文件和相关文档
      2. **代码实现**：
         - 创建新的目录结构（如需要）
         - 迁移代码到新位置（如需要）
         - 重构代码以符合新架构（提取接口、消除耦合、优化结构等）
         - 更新所有导入路径、引用和依赖
         - 更新依赖配置和构建配置
      3. **问题处理**：
         - 记录实施过程中遇到的问题（技术问题、兼容性问题等）
         - 提供解决方案和替代方案
         - 如果遇到阻塞问题，评估影响并调整迁移计划
      4. **进度跟踪**：
         - 记录已完成的文件和任务
         - 记录待完成的文件和任务
         - 更新实施进度和完成度
         - 识别可能的延期风险
      5. **下一步计划**：
         - 明确下一阶段的任务和目标
         - 准备下一阶段的实施环境和前置条件
         - 评估是否需要调整后续阶段的计划
      
      在实施时，请重点关注表单数据中指定的实施重点，遵循特殊说明。
    depends_on:
      - architecture-design

  - id: test-verification
    type: TestVerificationStep
    form:
      title: 测试验证
      schema:
        content:
          type: textarea
          title: 测试验证内容
          description: |
            💡 提示：请关注以下要点：
            1. 测试重点：明确重点关注哪些方面的测试（如：功能、性能、兼容性等）
            2. 验证标准：说明验证通过的标准或指标
            3. 已知问题：列出实施过程中已知的问题，需要在测试中重点关注
            4. 构建验证：验证新架构下的构建脚本、包构建、依赖关系和构建产物
            5. 功能测试：设计功能测试用例，执行测试并验证所有功能是否正常
            6. 集成测试：验证模块间的集成、接口调用、依赖注入和跨模块数据流
            7. 回归测试：执行完整的回归测试套件，验证原有功能未受影响
            8. 性能测试：测试启动时间、响应时间、内存使用，对比重构前后性能指标
            9. 问题跟踪：记录发现的所有问题，跟踪修复进度，验证修复效果
          required: false
    prompt: |
      你是一个专业的测试工程师，需要基于重构后的代码进行全面的测试验证：
      
      任务名称：{{ task.name }}
      * **方案路径**：{{ solutionPath }}

      关联的代码路径（需要测试的代码）：
      {% if relatedCodePaths %}
      {% for codePath in relatedCodePaths %}
      - {{ codePath }}
      {% endfor %}
      {% else %}
      （暂无关联代码路径）
      {% endif %}

      关联的文档（测试参考文档）：
      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      - {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}
      
      当前步骤表单数据：
      {% if formDataItems %}
      {% for item in formDataItems %}
      - {{ item.key }}: {{ item.value }}
      {% endfor %}
      {% else %}
      （暂无表单数据）
      {% endif %}
      
      请基于以上信息，进行全面的测试验证，包括：
      1. **构建验证**：
         - 验证新架构下的构建脚本是否正常工作
         - 验证所有包能否正确构建
         - 验证依赖关系是否正确
         - 验证构建产物是否完整
      2. **功能测试**：
         - 设计功能测试用例
         - 执行功能测试
         - 验证所有功能是否正常
         - 记录测试结果
      3. **集成测试**：
         - 验证模块间的集成是否正常
         - 验证接口调用和消息通信是否正常
         - 验证依赖注入和配置管理是否正常
         - 验证跨模块的数据流和业务流程是否正常
      4. **回归测试**：
         - 执行完整的回归测试套件
         - 验证原有功能未受影响
         - 验证性能未下降
         - 验证兼容性
      5. **性能测试**：
         - 测试启动时间
         - 测试响应时间
         - 测试内存使用
         - 对比重构前后的性能指标
      6. **问题跟踪**：
         - 记录发现的所有问题
         - 跟踪问题的修复进度
         - 验证问题修复后的效果
      
      在测试时，请重点关注表单数据中指定的测试重点，按照验证标准进行验证，特别关注已知问题。
    depends_on:
      - phase-implementation

  - id: documentation-update
    type: ArchiveUpdateStep
    form:
      title: 文档更新
      schema:
        content:
          type: textarea
          title: 文档更新内容
          description: |
            💡 提示：请关注以下要点：
            1. 文档类型：明确需要更新的文档类型（如：架构文档、API文档、用户手册等）
            2. 文档受众：说明文档的目标受众（如：开发者、用户、运维人员等）
            3. 特殊要求：列出文档更新的特殊要求或格式要求
            4. 架构文档更新：更新架构设计文档，反映新的架构结构、目录结构、模块划分和依赖关系图
            5. API文档更新：更新公共API文档、接口定义文档、使用示例和废弃API的迁移指南
            6. 迁移指南：编写详细的迁移指南，说明如何从旧架构迁移到新架构
            7. 变更日志：记录所有文件迁移、配置变更、API变更和破坏性变更
            8. README更新：更新项目README、构建说明、开发指南和贡献指南
          required: false
    prompt: |
      你是一个专业的文档管理专家，需要基于重构结果更新相关文档：
      
      任务名称：{{ task.name }}
      * **方案路径**：{{ solutionPath }}

      关联的文档（需要更新的文档）：
      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      - {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}

      关联的代码路径（重构后的代码，用于更新文档）：
      {% if relatedCodePaths %}
      {% for codePath in relatedCodePaths %}
      - {{ codePath }}
      {% endfor %}
      {% else %}
      （暂无关联代码路径）
      {% endif %}
      
      当前步骤表单数据：
      {% if formDataItems %}
      {% for item in formDataItems %}
      - {{ item.key }}: {{ item.value }}
      {% endfor %}
      {% else %}
      （暂无表单数据）
      {% endif %}
      
      请基于以上信息，更新相关文档，包括：
      1. **架构文档更新**：
         - 更新架构设计文档，反映新的架构结构
         - 更新目录结构说明
         - 更新模块划分说明
         - 更新依赖关系图
      2. **API文档更新**：
         - 更新公共API文档
         - 更新接口定义文档
         - 更新使用示例和最佳实践
         - 更新废弃API的迁移指南
      3. **迁移指南**：
         - 编写详细的迁移指南
         - 说明如何从旧架构迁移到新架构
         - 提供迁移步骤和注意事项
         - 提供常见问题解答
      4. **变更日志**：
         - 记录所有文件迁移
         - 记录所有配置变更
         - 记录所有API变更
         - 记录破坏性变更
