id: document-design-task-template
name: 文件任务模板
description: 标准任务流程：调研确认 → 编写调整方案 → 文档更新
category: task
# 步骤定义
steps:
  - id: research-confirm
    type: ResearchConfirmStep
    form:
      title: 调研确认
      schema:
        content:
          type: textarea
          title: 调研确认内容
          description: |
            💡 提示：请关注以下要点：
            1. 技术调研：调研相关技术方案、类库或框架的成熟度和适用性
            2. 方案对比：对比不同技术方案的优劣，评估与原谷 APP 需求的匹配度
            3. 决策依据：明确技术选型的决策依据和理由
            4. 调研输出：输出调研报告和技术选型决策文档
          required: false
    prompt: |
      你是一个**专业的技术调研专家 / 技术选型顾问**，需要基于以下信息进行**技术调研和方案确认**：

      * **任务名称**：{{ task.name }}
      * **调研目标**：{{ formDataItems[0].value }}
      * **相关文档路径**：{{ relatedDocuments }}

      ---

      ## 调研确认链式提示

      1. **技术调研**

        * 搜索和收集相关技术方案、类库或框架信息
        * 评估技术方案的成熟度（版本号、维护活跃度、社区支持）
        * 评估功能完整性（是否满足原谷 APP 的需求）
        * 评估技术方案的适用性和匹配度

      2. **方案对比分析**

        * 对比不同技术方案的优劣
        * 分析各方案的成本、风险和收益
        * 评估与原谷 APP 需求的匹配度

      3. **技术选型决策**

        * 基于调研结果，确定最终技术选型
        * 明确选择理由和决策依据
        * 记录备选方案和未选择的原因

      4. **调研报告输出**

        * 输出调研报告，包含候选方案清单和评估对比表
        * 输出技术选型决策文档，记录决策过程和理由

      ---

      ## 调研确认约束

      1. 调研应全面、客观，避免主观偏见
      2. 评估标准应明确、可量化
      3. 决策依据应充分、有说服力
      4. 调研报告应结构清晰，便于后续使用

      ---

      ## 参考资料 / 相关资源

      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      * {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}
    depends_on: []
  - id: draft-proposal
    type: DraftProposalStep
    form:
      title: 编写调整方案
      schema:
        content:
          type: textarea
          title: 编写调整方案内容
          description: |
            💡 提示：请关注以下要点：
            1. 调整目标：明确文档调整的目标和范围
            2. 调整内容：说明需要调整的具体内容和章节
            3. 调整理由：说明调整的原因和依据
            4. 影响分析：分析调整对相关文档和系统的影响
            5. 实施方案：制定清晰的文档调整实施步骤
          required: false
    prompt: |
      你是一个**专业的文档架构师 / 方案顾问**，需要基于调研确认结果，**编写文档调整方案**，明确调整目标、内容和实施步骤。

      ---

      ### 基本信息

      * **任务名称**：{{ task.name }}
      * **方案路径**：{{ solutionPath }}
      * **方案要求**：{{ formDataItems[0].value }}
      * **调研结果**：{{ researchResults }}

      ---

      ## 编写调整方案链式提示

      1. **调整目标与范围**

        * 明确文档调整的目标（技术选型调整、架构设计调整等）
        * 确定调整的范围（哪些章节需要调整）
        * 说明调整的背景和必要性

      2. **调整内容说明**

        * 详细说明需要调整的具体内容
        * 列出需要更新的章节和内容点
        * 说明调整前后的对比

      3. **调整理由与依据**

        * 说明调整的原因（基于调研结果、技术选型决策等）
        * 提供调整的依据和理由
        * 说明调整的合理性和必要性

      4. **影响分析**

        * 分析调整对当前文档的影响
        * 分析调整对相关文档的影响（如工具概览文档）
        * 分析调整对系统设计的影响

      5. **实施方案**

        * 制定清晰的文档调整实施步骤
        * 明确每个步骤的具体任务和输出
        * 确定调整的优先级和顺序

      ---

      ## 方案编写约束

      1. 方案应基于调研结果，确保调整有充分依据
      2. 方案应明确、具体，可直接指导文档调整
      3. 方案应分析影响，确保调整的合理性
      4. **任务粒度说明**：本任务聚焦于文档调整方案的编写，应简洁实用，聚焦当前任务的核心目标

      ---

      ## 参考资料 / 相关资源

      ### 调研结果

      {% if researchResults %}
      {{ researchResults }}
      {% else %}
      （暂无调研结果）
      {% endif %}

      ### 关联文档

      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      * {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}
    depends_on:
      - research-confirm
  - id: document-update
    type: DocumentUpdateStep
    form:
      title: 文档更新
      schema:
        content:
          type: textarea
          title: 文档更新内容
          description: |
            💡 提示：请关注以下要点：
            1. 文档调整：按照调整方案更新设计文档的具体内容
            2. 章节更新：更新技术选型、架构设计、依赖关系等章节
            3. 关联文档：更新相关文档（如工具概览文档）以保持一致性
            4. 变更记录：更新文档版本号和变更记录
          required: false
        selectedFolder:
          type: folder
          title: 选择文档所在文件夹
          description: 选择文档所在的文件夹位置（单选）
          multiple: false
    prompt: |
      你是一个**专业的文档编写专家 / 技术文档架构师**，需要基于调整方案，**更新设计文档**，确保文档准确反映最新的技术选型和架构设计。

      ---

      ### 基本信息

      * **任务名称**：{{ task.name }}
      * **文档路径**：{{ documentPath }}
      * **更新要求**：{{ formDataItems[0].value }}
      * **方案路径**：{{ solutionPath }}
      * **文档所在文件夹**：{{ formDataItems[1].value }}

      ---

      ## 文档更新链式提示

      1. **文档结构调整**

        * 根据调整方案，确定需要更新的章节
        * 在指定文件夹（{{ formDataItems[1].value }}）下查找和更新相关文档
        * 确保文档结构符合既定的文档模板和规范
        * 保持文档结构清晰、逻辑合理

      2. **技术选型章节更新**

        * 更新技术选型描述，反映最新的决策
        * 更新包的版本要求和依赖信息
        * 更新封装策略说明（如果适用）
        * 说明选择理由和决策依据

      3. **架构设计章节更新**

        * 更新架构设计描述，反映最新的架构调整
        * 更新架构图（Mermaid 格式），展示新的架构
        * 更新封装层次和扩展点说明
        * 说明与现有系统的集成方式

      4. **依赖关系章节更新**

        * 更新依赖的包、工具和模块信息
        * 更新依赖类型（必需/可选）
        * 更新依赖关系图

      5. **设计决策章节更新**

        * 更新或新增设计决策记录
        * 记录变更决策和理由
        * 说明决策的背景和依据

      6. **关联文档更新**

        * 识别需要更新的关联文档（如工具概览文档）
        * 更新关联文档中的相关描述，保持一致性
        * 更新关联文档的变更记录

      7. **变更记录更新**

        * 更新文档版本号（如从 1.0 升级到 1.1）
        * 在变更记录中记录更新内容
        * 明确说明变更的原因和影响
        * 确保变更记录格式规范

      ---

      ## 文档更新约束

      1. **严格基于调整方案**：文档更新应严格按照调整方案执行，不随意偏离
      2. **遵循文档规范**：遵循既定的文档格式、结构和命名规范
      3. **保持一致性**：确保文档内容与相关文档保持一致
      4. **内容准确**：确保更新的内容准确反映技术选型和架构设计
      5. **变更可追溯**：变更记录应完整，便于后续追溯
      6. **任务粒度说明**：本任务聚焦于设计文档的更新，应聚焦当前任务的核心目标

      ---

      ## 参考资料 / 相关资源

      ### 调整方案

      {% if solutionPath %}
      * **方案路径**：{{ solutionPath }}
      {% else %}
      （暂无调整方案）
      {% endif %}

      ### 关联文档（参考文档和需要更新的文档）

      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      * {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}
    depends_on:
      - draft-proposal
