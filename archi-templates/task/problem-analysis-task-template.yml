id: problem-analysis-task-template
name: 问题解决任务模板
description: 标准问题解决流程：问题分析 → 解决方案建议 → 研发实现 → 归档更新
category: task
# 步骤定义
steps:
  - id: problem-analysis
    type: DraftProposalStep
    form:
      title: 问题分析
      schema:
        content:
          type: textarea
          title: 问题分析内容
          description: |
            💡 提示：请关注以下要点：
            1. 问题现象：清晰描述问题的具体表现和症状
            2. 问题场景：说明问题出现的环境、条件和触发时机
            3. 影响范围：描述问题影响的系统、模块或功能
            4. 严重程度：评估问题的紧急程度和业务影响
            5. 复现步骤：提供问题的复现步骤（如可复现）
            6. 相关日志：提供错误日志、异常信息或相关线索
            7. 分析思路：说明分析的方法和思路（如：5Why、鱼骨图、故障树等）
            8. 可能原因：列出所有可能的原因假设
            9. 原因验证：通过日志、代码、数据等方式验证原因假设
            10. 根因定位：确定问题的根本原因
            11. 原因链条：梳理从根因到问题现象的原因链条
          required: false
    prompt: |
      你是一个**专业的问题分析专家**，需要基于以下信息进行**问题收集和根因分析**，找出问题的根本原因。

      ---

      ### 基本信息

      * **任务名称**：{{ task.name }}
      * **问题描述**：{{ formDataItems[0].value }}
      * **相关文档路径**：{{ relatedDocuments }}

      ---

      ## 问题分析链式提示

      ### 第一阶段：问题收集

      1. **问题现象梳理**

        * 整理问题的具体表现和症状
        * 明确问题的发生频率和规律
        * 识别问题的关键特征和异常点

      2. **问题场景分析**

        * 分析问题出现的环境条件
        * 识别问题的触发时机和前置条件
        * 梳理问题相关的业务流程或操作路径

      3. **影响范围评估**

        * 评估问题影响的系统、模块或功能
        * 分析问题对业务流程的影响
        * 评估问题的严重程度和紧急程度

      4. **问题信息整理**

        * 整理复现步骤（如可复现）
        * 收集相关日志、错误信息或异常堆栈
        * 整理相关代码路径、配置文件或数据

      5. **初步问题分类**

        * 根据问题特征进行初步分类
        * 识别可能的问题类型（性能、功能、稳定性等）
        * 为后续根因分析提供基础

      ### 第二阶段：根因分析

      1. **分析思路确定**

        * 选择合适的分析方法（5Why、鱼骨图、故障树等）
        * 确定分析的维度和角度
        * 制定分析计划和步骤

      2. **可能原因假设**

        * 基于问题现象，列出所有可能的原因假设
        * 从多个维度考虑（代码、配置、环境、数据、依赖等）
        * 对原因假设进行分类和优先级排序

      3. **原因验证**

        * 通过日志分析验证原因假设
        * 通过代码审查验证原因假设
        * 通过数据检查验证原因假设
        * 通过环境检查验证原因假设
        * 排除不相关的原因假设

      4. **根因定位**

        * 确定问题的根本原因
        * 区分直接原因和根本原因
        * 明确根因与问题现象的因果关系

      5. **原因链条梳理**

        * 梳理从根因到问题现象的完整原因链条
        * 识别原因链条中的关键节点
        * 分析原因链条中的放大效应或连锁反应

      6. **分析结论**

        * 总结根因分析结果
        * 明确问题的根本原因和关键因素
        * 为解决方案提供依据

      ---

      ## 问题分析约束

      1. 问题描述应准确、完整，不遗漏关键信息
      2. 收集的信息应客观、真实，避免主观臆断
      3. 分析应深入、全面，避免停留在表面现象
      4. 原因假设应基于事实，避免主观猜测
      5. 验证过程应严谨，确保根因定位准确
      6. 原因链条应清晰，便于理解问题本质
      7. **任务粒度说明**：本任务聚焦于问题分析，应简洁实用，聚焦当前问题的核心原因

      ---

      ## 参考资料 / 相关资源

      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      * {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}

      {% if relatedCodePaths %}
      ### 关联代码路径

      {% for codePath in relatedCodePaths %}
      * {{ codePath }}
      {% endfor %}
      {% endif %}
    depends_on: []

  - id: solution-suggestion
    type: DraftProposalStep
    form:
      title: 解决方案建议
      schema:
        content:
          type: textarea
          title: 解决方案建议内容
          description: |
            💡 提示：请关注以下要点：
            1. 解决思路：基于根因分析，提出解决问题的思路和方向
            2. 解决方案：设计具体的解决方案（可提供多个方案对比）
            3. 实施步骤：制定解决方案的实施步骤和计划
            4. 风险评估：评估解决方案的风险和影响
            5. 预防措施：提出预防类似问题的措施和建议
          required: false
    prompt: |
      你是一个**专业的解决方案专家**，需要基于问题分析结果，**提出解决方案建议**，帮助解决问题并预防类似问题。

      ---

      ### 基本信息

      * **任务名称**：{{ task.name }}
      * **方案路径**：{{ solutionPath }}
      * **建议要求**：{{ formDataItems[0].value }}
      * **问题分析结果**：{{ researchResults }}

      ---

      ## 解决方案建议链式提示

      1. **解决思路确定**

        * 基于问题分析结果，确定解决问题的思路和方向
        * 明确解决方案的目标和原则
        * 考虑解决方案的可行性和成本

      2. **解决方案设计**

        * 设计具体的解决方案（可提供多个方案对比）
        * 说明每个方案的优缺点和适用场景
        * 推荐最优方案并说明理由

      3. **实施步骤制定**

        * 制定解决方案的详细实施步骤
        * 明确每个步骤的具体任务和验收标准
        * 确定实施的优先级和顺序

      4. **风险评估**

        * 评估解决方案的实施风险
        * 评估解决方案对现有系统的影响
        * 制定风险应对措施和回滚方案

      5. **预防措施建议**

        * 提出预防类似问题的措施和建议
        * 建议改进监控、告警或检查机制
        * 建议优化代码、配置或流程

      6. **方案总结**

        * 总结解决方案的核心要点
        * 明确实施建议和注意事项
        * 为后续实施提供指导

      ---

      ## 解决方案建议约束

      1. 方案应基于根因分析，确保针对根本原因
      2. 方案应具体、可执行，避免过于抽象
      3. 方案应考虑可行性和成本，避免过度设计
      4. 风险评估应全面，确保方案安全可靠
      5. **任务粒度说明**：本任务聚焦于解决方案建议，应简洁实用，聚焦当前问题的解决

      ---

      ## 参考资料 / 相关资源

      ### 问题分析结果

      {% if researchResults %}
      {{ researchResults }}
      {% else %}
      （暂无问题分析结果）
      {% endif %}

      ### 关联文档

      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      * {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}

      {% if relatedCodePaths %}
      ### 关联代码路径

      {% for codePath in relatedCodePaths %}
      * {{ codePath }}
      {% endfor %}
      {% endif %}
    depends_on:
      - problem-analysis

  - id: implementation
    type: ImplementationStep
    form:
      title: 研发实现
      schema:
        content:
          type: textarea
          title: 研发实现内容
          description: |
            💡 提示：请关注以下要点：
            1. 代码实现：参考解决方案建议和关联代码路径，按照既定架构实现核心功能模块
            2. 代码结构：创建清晰的目录结构和模块划分，符合既定的设计规范
            3. 接口实现：实现模块间的接口定义和数据交互，确保与现有系统兼容
            4. 代码质量：遵循命名规范、代码风格和设计原则，确保可读性和可维护性
            5. 单元测试：编写单元测试覆盖核心业务逻辑和关键路径
            6. 集成测试：编写集成测试验证模块协作和系统集成
            7. 代码审查：进行代码自检和优化，确保质量达到可交付标准
          required: false
    prompt: |
      你是一个**资深开发工程师 / 技术实现专家**，需要基于已批准的解决方案建议，**实际编写代码并完成功能实现**，确保代码质量、可维护性和符合既定规范。

      ---

      ### 基本信息

      * **任务名称**：{{ task.name }}
      * **方案路径**：{{ solutionPath }}
      * **实现要求与约束**：{{ formDataItems[0].value }}

      ---

      ## 代码实现链式提示

      1. **方案理解与实现准备**

        * 准确理解解决方案建议中的技术架构、模块划分和实现策略
        * 明确本次实现的具体范围、技术选型和开发规范
        * 检查并准备必要的开发环境、依赖和工具

      2. **代码结构与模块实现**

        * 按照方案中的架构设计，创建清晰的目录结构和模块划分
        * 实现核心业务逻辑和关键功能模块
        * 确保代码结构符合既定的设计原则和规范要求

      3. **接口与集成实现**

        * 实现模块间的接口定义和数据交互
        * 完成与现有系统的集成和兼容性处理
        * 确保接口设计符合既定的接口风格和规范

      4. **代码质量与规范**

        * 遵循既定的代码结构、命名规范和设计原则
        * 确保代码具备良好的可读性、可维护性和可扩展性
        * 符合工程规范、质量标准和安全要求

      5. **测试编写与验证**

        * 编写单元测试，覆盖核心业务逻辑和关键路径
        * 编写集成测试，验证模块间的协作和系统集成
        * 执行测试并确保通过，修复发现的问题

      6. **代码审查与优化**

        * 进行代码自检，确保符合规范和最佳实践
        * 识别并优化代码中的潜在问题和性能瓶颈
        * 确保代码质量达到可交付标准

      ---

      ## 代码实现约束

      1. 严格遵循解决方案建议中的技术架构和实现策略，不随意偏离
      2. 确保代码实现与现有系统保持兼容，避免破坏性变更
      3. 关键代码需包含必要的注释说明
      4. 代码应具备良好的可测试性，关键逻辑需有测试覆盖
      5. 实现过程中如发现方案问题，应及时反馈并协商调整
      6. **任务粒度说明**：本任务聚焦于问题解决的实现，代码实现应聚焦当前问题的核心功能，避免过度设计

      ---

      ## 参考资料 / 相关资源

      ### 解决方案建议结果

      {% if researchResults %}
      {{ researchResults }}
      {% else %}
      （暂无解决方案建议结果）
      {% endif %}

      {% if relatedCodePaths %}
      ### 关联代码路径

      {% for codePath in relatedCodePaths %}
      * {{ codePath }}
      {% endfor %}
      {% else %}
      （暂无关联代码或实施参考）
      {% endif %}
    depends_on:
      - solution-suggestion

  - id: archive-update
    type: ArchiveUpdateStep
    form:
      title: 归档更新
      schema:
        content:
          type: textarea
          title: 文档更新内容
          description: |
            💡 提示：请关注以下要点：
            1. 文档列表：列出所有需要更新或创建的文档
            2. 更新内容：基于实现后的代码，更新文档的具体内容
            3. 文档结构：确保文档结构清晰、易于理解
            4. 归档建议：提供文档归档的位置和分类建议
            5. 版本管理：考虑文档版本控制和历史记录
          required: false
    prompt: |
      你是一个**专业的文档管理专家 / 知识库维护者**，需要基于研发实现结果，**更新相关文档**，确保文档与代码实现保持一致。

      ---

      ### 基本信息

      * **任务名称**：{{ task.name }}
      * **方案路径**：{{ solutionPath }}
      * **文档更新要求**：{{ formDataItems[0].value }}

      ---

      ## 文档更新链式提示

      1. **文档识别**

        * 识别需要更新的关联文档（优先考虑方案文档和技术文档）
        * 明确各文档的更新范围和优先级

      2. **内容更新**

        * 基于实现后的代码，更新文档的具体内容
        * 确保文档准确反映代码实现和关键设计

      3. **归档位置**

        * 提供文档归档的位置建议
        * 遵循既定的文档管理规范和知识库结构

      ---

      ## 文档更新约束

      1. 严格基于实际代码实现，确保文档与代码一致
      2. 遵循既定的文档规范和知识库结构
      3. 优先更新关联文档，避免创建过多新文档
      4. **任务粒度说明**：本任务聚焦于问题解决的文档更新，应简洁实用，仅更新必要的关联文档
      5. 输出内容应包含明确的更新清单和具体更新建议

      ---

      ## 关联文档与代码资源

      ### 关联文档（可能需要更新的文档）

      {% if relatedDocuments %}
      {% for doc in relatedDocuments %}
      * {{ doc.name }}: {{ doc.path }}
        {% if doc.vaultName %}所属 Vault: {{ doc.vaultName }}{% endif %}
      {% endfor %}
      {% else %}
      （暂无关联文档）
      {% endif %}

      ### 关联代码路径（实现后的代码，用于更新文档）

      {% if relatedCodePaths %}
      {% for codePath in relatedCodePaths %}
      * {{ codePath }}
      {% endfor %}
      {% else %}
      （暂无关联代码路径）
      {% endif %}
    depends_on:
      - implementation
