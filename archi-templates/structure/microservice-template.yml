name: microservice-template
description: 单微服务标准知识库目录结构（按业务领域分包，包内按领域分层）
type: dir-structure
structure:
  # 根 README
  - type: file
    name: README.md
    description: 微服务文档入口说明
    template: vault-microservice/archi-templates/content/microservice/01-overview/service-overview.md

  # 1. 服务概览（01 业务视角 / 02 技术视角）
  - type: directory
    name: 01-overview
    description: 服务与系统上下文（业务）、架构与技术栈（技术）；相关文档见 01（业务与系统上下文）、02（架构）
    children:
      - type: file
        name: 01-service-overview.md
        description: 面向产品/业务的唯一战略文档：服务简介、业务定位、目标用户、价值主张、系统上下文（含 C4 图）、职责与边界、能力依赖（业务级）；02-product 仅引用不重复；技术栈见 02-architecture
        template: vault-microservice/archi-templates/content/microservice/01-overview/service-overview.md
      - type: file
        name: 02-architecture.md
        description: 面向技术：C4 L2/L3、分层结构、技术栈与选型、系统依赖（技术）；技术栈以本文为准
        template: vault-microservice/archi-templates/content/microservice/01-overview/architecture.md
      - type: file
        name: 03-directory-structure.md
        description: 目录结构设计文档（按业务领域分包说明）；相关文档见 01（业务与系统上下文）、02（架构）
        template: vault-microservice/archi-templates/content/microservice/01-overview/directory-structure.md

  # 2. 产品设计
  - type: directory
    name: 02-product
    description: 产品需求与设计（产品/业务视角）
    children:
      - type: file
        name: 01-prd.md
        description: 产品需求文档（含需求背景、目标、用户故事与功能列表摘要、非功能需求、版本规划与路线图）；产品定位与目标用户见 01-overview/01-service-overview
        template: vault-microservice/archi-templates/content/microservice/02-product/prd.md
      - type: file
        name: 02-features.md
        description: 功能规格说明、功能列表、优先级与详细说明
        template: vault-microservice/archi-templates/content/microservice/02-product/features.md
      - type: file
        name: 03-ux-and-metrics.md
        description: 用户体验设计、交互流程、界面原型与产品指标、KPI、数据埋点
        template: vault-microservice/archi-templates/content/microservice/02-product/ux-and-metrics.md

  # 3. 按业务领域分包组织（核心变化）
  - type: directory
    name: 03-domains
    description: 按业务领域分包组织，每个领域内部按DDD分层
    children:
      # 领域概览（系统级）
      - type: directory
        name: 01-overview
        description: 领域概览文档（系统级领域划分）
        children:
          - type: file
            name: 01-domains-overview.md
            description: 领域划分、依赖与交互、子领域映射、限界上下文、基础设施与集成、共享模块、领域术语表（系统级合一文档）
            template: vault-microservice/archi-templates/content/microservice/03-domains/01-overview/01-domains-overview.md
      # 业务领域（示例，请根据实际领域名称重命名为 02-domain-xxx）
      - type: directory
        name: 02-domain-xxx
        description: "业务领域（示例，请根据实际领域名称重命名，如 02-domain-user、02-domain-order）；单文档按 DDD 组织"
        children:
          - type: file
            name: 01-module-overview.md
            description: 领域模块总览（DDD 合一）：概述与领域定义、技术栈与领域交互、架构设计、核心概念与目录结构、领域层/应用层/API/基础设施、错误处理、使用方式
            template: vault-microservice/archi-templates/content/microservice/03-domains/02-domain-xxx/domain-module-overview.md
      # 面向组件的共享能力（示例，请根据实际组件名称重命名为 03-component-xxx）
      - type: directory
        name: 03-component-xxx
        description: "面向组件的共享能力（示例，请根据实际模块名称重命名，如 03-component-command-bus、03-component-event-bus）"
        children:
          - type: file
            name: 01-module-overview.md
            description: 组件模块概览（模块说明、接口设计、实现架构、使用方式、技术栈等）
            template: vault-microservice/archi-templates/content/microservice/03-domains/03-component-xxx/shared-module-overview.md

  # 4. 表现层（全局，如适用）
  - type: directory
    name: 04-presentation
    description: 表现层设计文档（全局，如适用）
    children:
      # 表现层概览（含路由、状态、UI/主题章节）
      - type: directory
        name: 01-overview
        description: 表现层概览文档
        children:
          - type: file
            name: 01-presentation-overview.md
            description: 表现层概览，含定位、职责、设计原则、路由与导航、状态管理、UI与主题
            template: vault-microservice/archi-templates/content/microservice/04-presentation/01-overview/presentation-overview.md
      # 组件设计（按类分目录，每类一个合并文档）
      - type: directory
        name: 02-components
        description: 组件设计（基础组件、业务组件、布局组件）
        children:
          - type: directory
            name: 01-overview
            description: 组件概览
            children:
              - type: file
                name: 01-components-overview.md
                description: 组件分类、组件设计原则、组件开发规范
                template: vault-microservice/archi-templates/content/microservice/04-presentation/02-components/components-overview.md
          - type: directory
            name: 02-base
            description: 基础组件（按钮、输入框、表格等合并文档）
            children:
              - type: file
                name: 01-base-components.md
                description: 基础组件设计，含 Button/Input/Table 等 API、示例、样式
                template: vault-microservice/archi-templates/content/microservice/04-presentation/02-components/base-components.md
          - type: directory
            name: 03-business
            description: 业务组件（订单卡片、用户头像等合并文档）
            children:
              - type: file
                name: 01-business-components.md
                description: 业务组件设计，含组件分节、API、业务逻辑、示例
                template: vault-microservice/archi-templates/content/microservice/04-presentation/02-components/business-components.md
          - type: directory
            name: 04-layout
            description: 布局组件（头部、侧边栏、容器等合并文档）
            children:
              - type: file
                name: 01-layout-components.md
                description: 布局组件设计，含 Header/Sidebar/Container 等 API、布局规则、示例
                template: vault-microservice/archi-templates/content/microservice/04-presentation/02-components/layout-components.md
      # 视图/页面设计（仅概览，复杂视图按需增 02-xxx）
      - type: directory
        name: 03-views
        description: 视图/页面设计（可选）
        children:
          - type: directory
            name: 01-overview
            description: 视图概览
            children:
              - type: file
                name: 01-views-overview.md
                description: 视图分类、设计原则、与组件关系、视图清单
                template: vault-microservice/archi-templates/content/microservice/04-presentation/03-views/views-overview.md
      # Hooks/Composables设计（仅概览，复杂 Hook 按需增 02-use-xxx）
      - type: directory
        name: 04-hooks
        description: Hooks/Composables设计（如适用）
        children:
          - type: directory
            name: 01-overview
            description: Hooks概览
            children:
              - type: file
                name: 01-hooks-overview.md
                description: Hooks分类、设计原则、开发规范、Hooks清单
                template: vault-microservice/archi-templates/content/microservice/04-presentation/04-hooks/hooks-overview.md

  # 5. 数据存储
  - type: directory
    name: 05-storage
    description: 数据库与数据流（跨领域或全局）
    children:
      - type: file
        name: 01-schema.md
        description: 数据库结构文档
        template: vault-microservice/archi-templates/content/microservice/05-storage/schema.md
      - type: file
        name: 02-migration-history.md
        description: 迁移历史（适配 Anchor Model）
        template: vault-microservice/archi-templates/content/microservice/05-storage/migration-history.md
      - type: file
        name: 03-dataflow.md
        description: 数据流、事件流说明
        template: vault-microservice/archi-templates/content/microservice/05-storage/dataflow.md

  # 6. 运维 & SRE
  - type: directory
    name: 06-operations
    description: 运维、部署、可观测性
    children:
      - type: file
        name: 01-deployment.md
        description: 部署架构（K8s/Mesh）
        template: vault-microservice/archi-templates/content/microservice/06-operations/deployment.md
      - type: file
        name: 02-dependencies.md
        description: 外部依赖清单
        template: vault-microservice/archi-templates/content/microservice/06-operations/dependencies.md
      - type: file
        name: 03-observability.md
        description: Metrics/Logs/Tracing
        template: vault-microservice/archi-templates/content/microservice/06-operations/observability.md
      - type: file
        name: 04-sre.md
        description: SLA/SLO/SLI 设计
        template: vault-microservice/archi-templates/content/microservice/06-operations/sre.md
      - type: file
        name: 05-runbook.md
        description: 故障处理手册
        template: vault-microservice/archi-templates/content/microservice/06-operations/runbook.md

  # 7. 测试
  - type: directory
    name: 07-testing
    description: 测试策略与记录
    children:
      - type: file
        name: 01-test-strategy.md
        description: 单测、集测、契约测试策略
        template: vault-microservice/archi-templates/content/microservice/07-testing/test-strategy.md
      - type: file
        name: 02-performance-test.md
        description: 性能/压力测试
        template: vault-microservice/archi-templates/content/microservice/07-testing/performance-test.md
      - type: file
        name: 03-test-cases
        description: 测试用例集
        template: vault-microservice/archi-templates/content/microservice/07-testing/test-strategy.md

  # 8. 安全
  - type: directory
    name: 08-security
    description: 安全策略
    children:
      - type: file
        name: 01-threat-model.md
        description: 威胁建模（STRIDE）
        template: vault-microservice/archi-templates/content/microservice/08-security/threat-model.md
      - type: file
        name: 02-authz-authn.md
        description: 鉴权认证策略
        template: vault-microservice/archi-templates/content/microservice/08-security/authz-authn.md
      - type: file
        name: 03-data-protection.md
        description: 数据保护、加密、脱敏
        template: vault-microservice/archi-templates/content/microservice/08-security/data-protection.md
      - type: file
        name: 04-audit.md
        description: 审计日志规范
        template: vault-microservice/archi-templates/content/microservice/08-security/audit.md

  # 9. 交付 & CI/CD
  - type: directory
    name: 09-delivery
    description: 交付、版本管理、CI-CD
    children:
      - type: file
        name: 01-environments.md
        description: 环境说明（dev/stage/prod）
        template: vault-microservice/archi-templates/content/microservice/09-delivery/environments.md
      - type: file
        name: 02-ci.md
        description: CI 流水线配置
        template: vault-microservice/archi-templates/content/microservice/09-delivery/ci.md
      - type: file
        name: 03-cd.md
        description: CD / 灰度 / 蓝绿发布
        template: vault-microservice/archi-templates/content/microservice/09-delivery/cd.md
      - type: file
        name: 04-release-notes
        description: 发布说明记录
        template: vault-microservice/archi-templates/content/microservice/01-overview/service-overview.md

  # 10. 架构决策 ADR
  - type: directory
    name: 10-decisions
    description: 架构决策记录（ADR）
    children:
      - type: file
        name: ADR-YYYYMMDD-decision-title.md
        description: ADR 示例（命名格式：ADR-日期-决策标题，如 ADR-20240101-technology-selection.md）
        template: vault-microservice/archi-templates/content/markdown/adr-template.md
